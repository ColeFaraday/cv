# One-sentence description for non-academic audience
tagline: >-
  PhD student in theoretical physics at the University of Cape Town, researching the quark-gluon plasma---a
  novel state of matter formed microseconds after the Big Bang---through connections between theory and experimental observations from high-energy heavy-ion collisions.

